name: Release

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:coverage

      - name: Run linting
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build project
        run: npm run build

      # Publishing is the one moment a broken artefact cannot be taken back.
      - name: Smoke-test the published package
        run: npm run smoke

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Set here rather than in package.json so that a local `npm publish`
          # still works as a fallback — provenance can only be generated by a
          # recognised CI runner, and npm fails the publish outright elsewhere.
          NPM_CONFIG_PROVENANCE: true
        run: npx semantic-release
