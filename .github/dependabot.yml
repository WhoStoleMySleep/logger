version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: chore
    groups:
      # Small bumps go in one PR: CI runs the whole matrix either way, and
      # nobody reads ten separate merge requests a week.
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies"]
    commit-message:
      prefix: chore
